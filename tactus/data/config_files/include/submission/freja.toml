[submission]
  account = "#SBATCH -A accord"
  arch = "intel/2023a"
  default_submit_type = "serial"
  lfftw = true
  module_initfile = "/software/sse2/init/nsc_lmod_init.sh"
  nproma = -32

[submission.iomerge.age_limit]
  fullpos = 15
  history = 15
  surfex = 15

[submission.iomerge.files_expected]
  fullpos = 0
  history = -1
  surfex = 0

[submission.types.background]
  SCHOST = "localhost"
  tasks = []

[submission.types.parallel]
  NPROC = 32
  SCHOST = "freja"
  tasks = ["Forecast", "E927", "C903"]
  WRAPPER = "mpprun"

[submission.types.parallel.BATCH]
  NAME = "#SBATCH --job-name=@TASK_NAME@"
  WALLTIME = "#SBATCH --time=00:10:00"

[submission.types.parallel.ENV]
  DR_HOOK = 1
  OMP_NUM_THREADS = 1

[submission.types.parallel.ENV_FILE]
  env_file_path = "@CASEDIR@/IAL/bundle/arch/nsc/freja/intel/2023a/env.sh"

[submission.types.serial]
  NPROC = 1
  NPROCX = 1
  NPROCY = 1
  SCHOST = "freja"
  WRAPPER = "mpprun"

[submission.types.serial.BATCH]
  MEMORY = "#SBATCH --mem=64GB"
  NAME = "#SBATCH --job-name=@TASK_NAME@"
  NODES = "#SBATCH --nodes=1"
  NTASKS = "#SBATCH --ntasks=1"
  WALLTIME = "#SBATCH --time=00:15:00"

[submission.types.serial.ENV]
  DR_HOOK_IGNORE_SIGNALS = -1
  OMP_NUM_THREADS = 1
  OMPI_MCA_btl = "^vader"

[submission.types.serial.ENV_FILE]
  env_file_path = "@CASEDIR@/IAL/bundle/arch/nsc/freja/intel/2023a/env.sh"

[submission.types.simple]
  SCHOST = "freja"
  tasks = [ "IALclone" ]
  WRAPPER = ""

[submission.types.simple.BATCH]
  NAME = "#SBATCH --job-name=@TASK_NAME@"
  NODES = "#SBATCH --nodes=1"
  NTASKS = "#SBATCH --ntasks=1"
  WALLTIME = "#SBATCH --time=00:15:00"

[submission.types.task]
  wrapper = ""

[submission.task_exceptions.TactusBundleBuild.BATCH]
  MEMORY = "#SBATCH --mem=0GB"
  WALLTIME = "#SBATCH --time=03:00:00"
  CPUSPERTASK = "#SBATCH --cpus-per-task=64"
